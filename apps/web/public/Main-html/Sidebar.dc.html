<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    :root{
      --sidebar-bg: oklch(19% 0.014 75);
      --sidebar-border: oklch(28% 0.02 75);
      --sidebar-text: oklch(88% 0.012 75);
      --sidebar-text-muted: oklch(60% 0.015 75);
      --sidebar-text-faint: oklch(42% 0.015 75);
      --sidebar-active-bg: oklch(27% 0.02 75);
      --accent: oklch(64% 0.14 55);
    }
    *{box-sizing:border-box;}
    body{margin:0;font-family:"Work Sans",system-ui,sans-serif;}
    a{text-decoration:none;cursor:pointer;}
    .group-label{font-size:11px;font-weight:600;letter-spacing:0.08em;color:var(--sidebar-text-faint);text-transform:uppercase;padding:0 12px;margin:22px 0 6px 0;}
    .nav-row{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;font-size:13.5px;margin:0 8px;cursor:pointer;}
    .nav-icon{width:18px;height:18px;flex-shrink:0;}
    .util-row{display:flex;align-items:center;gap:10px;padding:7px 12px;margin:0 8px;font-size:12.5px;color:var(--sidebar-text-muted);}
  </style>
</helmet>
<div style="width:240px;height:100%;min-height:900px;background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding:20px 0;">

  <div style="display:flex;align-items:center;gap:10px;padding:0 20px 20px 20px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" fill="var(--accent)"/>
      <path d="M12 3v3.2M12 17.8V21M3 12h3.2M17.8 12H21M5.8 5.8l2.3 2.3M15.9 15.9l2.3 2.3M18.2 5.8l-2.3 2.3M8.1 15.9l-2.3 2.3" stroke="var(--sidebar-bg)" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <span style="font-size:16px;font-weight:700;color:var(--sidebar-text);letter-spacing:-0.01em;">Everlumen</span>
  </div>

  <div style="flex-grow:1;overflow-y:auto;">

    <div class="group-label">Workspace</div>

    <a class="nav-row" style="background:{{nav.overview.bg}};" onClick="{{nav.overview.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.overview.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M9.5 20v-6h5v6"/></svg>
      <span style="color:{{nav.overview.color}};font-weight:{{nav.overview.weight}};">Overview</span>
    </a>

    <a class="nav-row" style="background:{{nav.projects.bg}};" onClick="{{nav.projects.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.projects.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="14" rx="2"/><path d="M3.5 9.5h17"/><path d="M8 3.5v3M16 3.5v3"/></svg>
      <span style="color:{{nav.projects.color}};font-weight:{{nav.projects.weight}};">Projects</span>
    </a>

    <a class="nav-row" style="background:{{nav.photoLibrary.bg}};" onClick="{{nav.photoLibrary.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.photoLibrary.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M20.5 15.5 15 10l-9.5 9"/></svg>
      <span style="color:{{nav.photoLibrary.color}};font-weight:{{nav.photoLibrary.weight}};">Photo Library</span>
    </a>

    <a class="nav-row" style="background:{{nav.maps.bg}};" onClick="{{nav.maps.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.maps.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5c4-4.2 7-8 7-11.4A7 7 0 0 0 5 10.1c0 3.4 3 7.2 7 11.4Z"/><circle cx="12" cy="10" r="2.4"/></svg>
      <span style="color:{{nav.maps.color}};font-weight:{{nav.maps.weight}};">Maps</span>
    </a>

    <div class="group-label">Set up</div>

    <a class="nav-row" style="background:{{nav.blueprints.bg}};" onClick="{{nav.blueprints.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.blueprints.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.5 8.5 4.8L12 13 3.5 8.3 12 3.5Z"/><path d="m3.5 13 8.5 4.8 8.5-4.8"/><path d="m3.5 17.7 8.5 4.8 8.5-4.8"/></svg>
      <span style="color:{{nav.blueprints.color}};font-weight:{{nav.blueprints.weight}};">Blueprints</span>
    </a>

    <a class="nav-row" style="background:{{nav.checklists.bg}};" onClick="{{nav.checklists.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.checklists.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 1.6 1.6L8.5 4.8"/><path d="M11 6h9.5"/><path d="m4 12.5 1.6 1.6 2.9-2.8"/><path d="M11 12.5h9.5"/><path d="m4 19 1.6 1.6 2.9-2.8"/><path d="M11 19h9.5"/></svg>
      <span style="color:{{nav.checklists.color}};font-weight:{{nav.checklists.weight}};">Checklists</span>
    </a>

    <a class="nav-row" style="background:{{nav.documents.bg}};" onClick="{{nav.documents.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.documents.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1Z"/><path d="M14 3.5v4h4"/><path d="M8.5 12.5h7M8.5 15.5h7M8.5 9.5h3"/></svg>
      <span style="color:{{nav.documents.color}};font-weight:{{nav.documents.weight}};">Documents</span>
    </a>

    <a class="nav-row" style="background:{{nav.teams.bg}};" onClick="{{nav.teams.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.teams.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17.3" cy="9.3" r="2.3"/><path d="M15.2 14c2.4.5 4 2.6 4 6"/></svg>
      <span style="color:{{nav.teams.color}};font-weight:{{nav.teams.weight}};">Teams</span>
    </a>

    <div class="group-label">Client-facing</div>

    <a class="nav-row" style="background:{{nav.portfolio.bg}};" onClick="{{nav.portfolio.onClick}}">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="{{nav.portfolio.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.3 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.3-3.6-8.5S9.6 5.8 12 3.5Z"/></svg>
      <span style="color:{{nav.portfolio.color}};font-weight:{{nav.portfolio.weight}};">Portfolio</span>
    </a>

  </div>

  <div style="border-top:1px solid var(--sidebar-border);padding-top:10px;margin-top:10px;">
    <div class="util-row" style="cursor:pointer;color:{{nav.knowledgeBase.color}};font-weight:{{nav.knowledgeBase.weight}};" onClick="{{nav.knowledgeBase.onClick}}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{nav.knowledgeBase.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5V6a2 2 0 0 1 2-2h9l5 5v10.5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 4v4.5a1 1 0 0 0 1 1H19.5"/></svg>
      <span>Knowledge Base</span>
    </div>
    <div class="util-row" style="cursor:pointer;color:{{nav.feedback.color}};font-weight:{{nav.feedback.weight}};" onClick="{{nav.feedback.onClick}}">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{nav.feedback.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.5-8.5 7.5-1 0-1.9-.1-2.8-.4L4.5 20.5l1.6-3.8C4.8 15.3 3.5 13.3 3.5 11 3.5 6.9 7.3 3.5 12 3.5s8.5 3.4 8.5 7Z"/></svg>
      <span>Feedback</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 12px 2px 12px;margin-top:6px;">
      <div style="width:28px;height:28px;border-radius:999px;background:var(--sidebar-active-bg);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sidebar-text);flex-shrink:0;">AJ</div>
      <div style="flex-grow:1;min-width:0;">
        <div style="font-size:12.5px;font-weight:600;color:var(--sidebar-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Ajmal</div>
        <div style="font-size:11px;color:var(--sidebar-text-faint);">Everbreeze Heating and Air</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":null},"onNavigate":{"editor":null}}'>
class Component extends DCLogic {
  renderVals() {
    const activeBg = "var(--sidebar-active-bg)";
    const activeColor = "var(--accent)";
    const idleColor = "var(--sidebar-text)";
    const keys = ["overview","projects","photoLibrary","maps","blueprints","checklists","documents","teams","portfolio","feedback","knowledgeBase"];
    const active = this.props.active ?? "overview";
    const go = this.props.onNavigate ?? (() => {});
    const nav = {};
    keys.forEach((k) => {
      const isActive = k === active || (k === "projects" && active === "projectDetail");
      const idle = (k === "feedback" || k === "knowledgeBase") ? "var(--sidebar-text-muted)" : idleColor;
      nav[k] = {
        bg: isActive ? activeBg : "transparent",
        color: isActive ? activeColor : idle,
        weight: isActive ? "600" : "500",
        onClick: () => go(k),
      };
    });
    return { nav };
  }
}
</script>
</body>
</html>
