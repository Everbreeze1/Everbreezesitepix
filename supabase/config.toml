# Project ID of the owned Everlumen Supabase project (not Lovable Cloud).
project_id = "ulmgvtuqjlzzadlwtiog"

# -----------------------------------------------------------------------------
# Auth
# -----------------------------------------------------------------------------
# Everything below used to live only in the dashboard, which meant nobody could
# review a change to it and nothing recorded what the intended values were.
#
# IMPORTANT: writing it here does NOT change the live project. It takes effect
# only when the CLI is linked and `supabase config push` is run - until then the
# dashboard is still authoritative. See LAUNCH.md § Supabase.
[auth]
# The site actually serves from www - Vercel 308s the apex there - so links
# built by Auth (confirm, recover, invite) must point at www or the user lands
# on a redirect that drops the URL fragment carrying the token.
site_url = "https://www.everlumen.co"

# Post-auth redirect allow-list. Globs are needed because two of the landing
# paths are dynamic: `/invite/<token>` (apps/api teams service builds
# `${origin}/invite/${token}`) and the portfolio pages under `/p/<slug>`.
additional_redirect_urls = [
  "https://www.everlumen.co/**",
  # The apex only ever 308s to www, but keep it allow-listed so an old link that
  # somehow reaches Auth directly still validates instead of erroring.
  "https://everlumen.co/**",
  # Local dev - Vite serves on 8080 (apps/web/vite.config.ts `server.port`).
  "http://localhost:8080/**",
  "http://127.0.0.1:8080/**",
  # UNVERIFIED: Vercel preview deployments. Uncomment and substitute the Vercel
  # team slug (Vercel dashboard → project → Deployments → any preview URL) if
  # previews need to sign in. Left commented rather than guessed, because a
  # wrong wildcard here is an open redirect.
  # "https://*-<vercel-team-slug>.vercel.app/**",
]

# Access-token lifetime. 1 hour is the Supabase default and is short enough that
# a leaked access token expires quickly; sessions survive it via refresh tokens.
jwt_expiry = 3600

# Rotate the refresh token on every use and revoke the whole family if an
# already-used token is replayed - this is what makes a stolen refresh token
# detectable rather than permanent.
enable_refresh_token_rotation = true
# Grace window for the rotated token, so a double-fired refresh (two tabs, or a
# retried request) does not log the user out.
refresh_token_reuse_interval = 10

enable_signup = true
# Nothing in the product signs users in anonymously; leaving this off closes a
# free route to creating rows as an "authenticated" user.
enable_anonymous_sign_ins = false
enable_manual_linking = false

# The app already refuses shorter passwords client-side (reset-password.tsx and
# invite.$token.tsx both check `password.length < 8`); this enforces the same
# rule server-side, where it cannot be bypassed by calling GoTrue directly.
minimum_password_length = 8
# Deliberately left at the Supabase default (no character-class requirement).
# Tightening it would reject passwords the existing signup UI presents as valid,
# so it is a product decision, not a config cleanup.
password_requirements = ""

[auth.email]
enable_signup = true
# Confirmations are ON in production - signup.tsx branches on `!data.session`
# ("Check your email to confirm your account") and login.tsx exposes a
# `resend({ type: "signup" })` action, neither of which is reachable otherwise.
enable_confirmations = true
# An email change must be confirmed from the OLD address too, so a hijacked
# session cannot silently move the account to an attacker's inbox.
double_confirm_changes = true
# Changing a password requires a recent login rather than just a live session.
secure_password_change = true
# Throttle repeat confirmation/reset sends per user. 60s is well under the
# 1-hour deliverability window and blunts inbox-flooding via the signup form.
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

# Per-IP auth abuse limits. These are separate from the API's own limiter in
# apps/api/src/lib/rate-limit.ts - that one never sees Supabase Auth traffic,
# because the browser talks to GoTrue directly.
[auth.rate_limit]
# Sign-in + sign-up attempts per 5 minutes per IP.
sign_in_sign_ups = 30
# Magic-link / OTP verifications per 5 minutes per IP.
token_verifications = 30
# Session refreshes per 5 minutes per IP. Left at the default: it has to absorb
# every open tab of every user behind a shared corporate NAT.
token_refresh = 150
anonymous_users = 30
# NOTE: `email_sent` is intentionally omitted. It only applies when Supabase
# sends the mail itself; this project overrides delivery with a Send Email auth
# hook (apps/api `/v1/auth/send-email` → Resend), so the effective email rate
# limit is the API's EMAIL_RATE_LIMIT, not this.

# The Send Email auth hook, the SMTP sender, and the Google/Apple OAuth
# providers are deliberately NOT declared here. They carry secrets, and more
# importantly `supabase config push` writes the whole auth block - declaring a
# provider here with `enabled = false`, or omitting one the CLI defaults to off,
# would switch off a login method that is currently live. Leave those in the
# dashboard until someone has verified how the push behaves for this project.
